# fusion-mlx venvstacks layer spec.
# AUTO-GENERATED — do not edit manually.
# Regenerate with: python packaging/build.py --generate-venvstacks-toml packaging/venvstacks.toml
# Source of truth for Python deps: pyproject.toml [project] + [grammar] + [mcp].

[[runtimes]]
name = "cpython-3.11"
python_implementation = "cpython@3.11.10"
requirements = []
platforms = [
    "macosx_arm64",
]

[[frameworks]]
name = "mlx-base"
runtime = "cpython-3.11"
requirements = [
    # Populated by build.py from pyproject.toml + local wheels.
    # Run: python packaging/build.py --generate-venvstacks-toml packaging/venvstacks.toml
]
platforms = [
    "macosx_arm64",
]
# cv2 is pulled transitively; its bundled dylibs duplicate PIL's. Exclude
# cv2's copies so venvstacks picks a single provider (matches fusion-mlx layer).
dynlib_exclude = [
    "cv2/.dylibs/libavif*",
    "cv2/.dylibs/liblcms2*",
    "cv2/.dylibs/libpng16*",
    "cv2/.dylibs/libtiff*",
    "cv2/.dylibs/libfreetype*",
    "cv2/.dylibs/libharfbuzz*",
    "cv2/.dylibs/liblzma*",
    "cv2/.dylibs/libxcb*",
    "cv2/.dylibs/libXau*",
    # macOS debug-symbol bundles (.dSYM) sit next to the real loadable dylib
    # and shadow it; exclude files inside any .dSYM so the real dylib wins.
    "**/*.dSYM/**",
    # libomp (OpenMP runtime) is bundled by both sklearn/.dylibs and torch/lib.
    # Keep torch's copy (canonical ML provider), drop sklearn's bundled dup.
    "sklearn/.dylibs/libomp*",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
