name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install ruff black mypy
            - run: ruff check fusion_mlx/ tests/
            - run: black --check fusion_mlx/ tests/

    security:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: pip-audit
              run: |
                  pip install pip-audit
                  pip-audit --desc 2>&1 || true
            - name: bandit SAST
              run: |
                  pip install bandit
                  bandit -r fusion_mlx/ -ll -ii 2>&1 || true

    test:
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
            - run: pip install -e ".[dev]"
            - run: pip install pytest-cov
            - name: Run unit tests with coverage
              run: |
                  pytest tests/unit -v --tb=short --cov=fusion_mlx --cov-report=term-missing --cov-report=xml --cov-fail-under=40 2>&1 | tee pytest-output.txt
            - name: Guard against excessive skips
              run: |
                  SKIPPED=$(grep -oE '[0-9]+ skipped' pytest-output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
                  PASSED=$(grep -oE '[0-9]+ passed' pytest-output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
                  TOTAL=$((PASSED + SKIPPED))
                  if [ "$TOTAL" -eq 0 ]; then echo "ERROR: no tests collected"; exit 1; fi
                  PCT=$((SKIPPED * 100 / TOTAL))
                  echo "Skipped: ${SKIPPED}/${TOTAL} (${PCT}%)"
                  if [ "$PCT" -gt 10 ]; then
                    echo "FAIL: >10% tests skipped (${PCT}%) — CI provides false confidence"
                    exit 1
                  fi
