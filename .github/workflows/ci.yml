name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  # Black's target-version includes py313, so its AST safety
                  # check must run on a Python >= the highest target (3.13).
                  # Running on 3.12 makes py313-formatted files "would reformat"
                  # spuriously. Matches the dev env + the test matrix's 3.13.
                  python-version: "3.13"
            - run: pip install ruff black mypy
            - run: ruff check fusion_mlx/ tests/
            - run: black --check fusion_mlx/ tests/

    security:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: pip-audit
              run: |
                  pip install pip-audit
                  pip-audit --desc 2>&1 || true
            - name: bandit SAST
              run: |
                  pip install bandit
                  bandit -r fusion_mlx/ -ll -ii 2>&1 || true

    public-api-boundary:
        # #615/#613: warn when downstream (fusion-comfyui) reaches into
        # fusion_mlx internal submodules instead of the stable public_api
        # layer. Warn-only during the migration window (no --fail-on-warn):
        # existing 13 grandfathered imports pass via the whitelist, a NEW
        # internal-module import surfaces as a warning for review.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
            - name: Shallow-clone fusion-comfyui downstream
              run: |
                  git clone --depth 1 https://github.com/dahai80/fusion-comfyui.git /tmp/fusion-comfyui
            - name: Scan downstream for internal-module imports
              run: |
                  python scripts/check_public_api_boundary.py \
                      --downstream /tmp/fusion-comfyui \
                      --whitelist scripts/public_api_whitelist.txt

    test:
        # PR-D11.3 (L18): modality/engine sharding + build cache. The
        # single Python-version matrix is replaced by a shard dimension
        # (core/llm/modal/infra/exp/rest) running on Python 3.12 (the
        # canonical dev version). Lint already covers 3.13; the 3-version
        # matrix was single-dim and serialized all 14k tests on one runner.
        # Shards run in parallel → faster feedback, smaller blast radius.
        # A pip wheel cache (keyed on pyproject + lockfile) speeds install.
        strategy:
            fail-fast: false
            matrix:
                shard: ["core", "llm", "modal", "infra", "exp", "rest"]
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Cache pip wheels
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-3.12-${{ hashFiles('pyproject.toml') }}
                  restore-keys: ${{ runner.os }}-pip-3.12-
            # Install [vlm] so conftest's mlx_vlm mock is NOT triggered on
            # macOS CI (real mlx_vlm 0.5.0 installs cleanly on Apple Silicon).
            # Without it, 38 VLM tests fail: `from mlx_vlm.models.X import Y`
            # resolves Y to MagicMock → isinstance/issubclass always False.
            # macOS-14 runners are M1 → mlx + mlx_vlm wheels available.
            - run: pip install -e ".[dev,vlm]"
            - run: pip install pytest-cov
            - name: Resolve shard file list
              id: shard
              run: |
                  FILES=$(python scripts/shard_tests.py ${{ matrix.shard }})
                  echo "count: $(echo $FILES | wc -w) files in shard ${{ matrix.shard }}"
                  echo "files=$FILES" >> "$GITHUB_OUTPUT"
            - name: Run unit tests with coverage
              run: |
                  set -eo pipefail
                  pytest ${{ steps.shard.outputs.files }} -v --tb=short --cov=fusion_mlx --cov-report=term-missing --cov-report=xml --cov-fail-under=40 --junitxml=pytest-junit.xml 2>&1 | tee pytest-output.txt
            - name: Guard against excessive skips
              if: always()
              run: |
                  # Count PASSED and SKIPPED from per-test lines in pytest-output.txt.
                  # The final summary line may be missing if GHA log display truncates,
                  # but the file on disk is complete. Each test emits a line like:
                  #   tests/unit/test_foo.py::test_bar PASSED [ 12%]
                  PASSED=$(grep -cE ' PASSED \[' pytest-output.txt || echo 0)
                  SKIPPED=$(grep -cE ' SKIPPED \[' pytest-output.txt || echo 0)
                  TESTS=$((PASSED + SKIPPED))
                  if [ "$TESTS" -eq 0 ]; then echo "ERROR: no tests collected"; exit 1; fi
                  PCT=$((SKIPPED * 100 / TESTS))
                  echo "Passed: ${PASSED}, Skipped: ${SKIPPED}/${TESTS} (${PCT}%)"
                  if [ "$PCT" -gt 10 ]; then
                    echo "FAIL: >10% tests skipped (${PCT}%) — CI provides false confidence"
                    exit 1
                  fi

    test-versions:
        # PR-D11.3: keep Python 3.11 + 3.13 version coverage (was the
        # old matrix). Runs the ``core`` shard only — the smallest, most
        # API-surface-sensitive shard — so version regressions are caught
        # without re-running the full suite per version.
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.13"]
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Cache pip wheels
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
                  restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-
            - run: pip install -e ".[dev,vlm]"
            - run: pip install pytest-cov
            - name: Run core shard (version coverage)
              run: |
                  set -eo pipefail
                  FILES=$(python scripts/shard_tests.py core)
                  pytest $FILES -v --tb=short --cov=fusion_mlx --cov-report=term-missing 2>&1 | tee pytest-output.txt

    eval:
        # G1/S1: evaluation gate (ADVISORY). Runs perf/coherence/tool-call gates.
        # No baseline → ADVISORY (warn, never fail CI). When a baseline file
        # exists (evals/baselines/), regressions beyond threshold become enforce.
        # CI has no running server → gates skip gracefully (advisory contract).
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - run: pip install -e ".[dev]"
            - name: Run perf gate (ADVISORY — skips if no server)
              run: |
                  python -m fusion_mlx.eval.perf_gate --model noop \
                    --baseline evals/baselines/perf_baseline.json 2>&1 | tee eval-output.txt || true
            - name: Verify gate skipped gracefully (advisory contract)
              run: |
                  grep -q "ADVISORY\|no samples\|server unreachable" eval-output.txt
            - name: Run eval gate unit tests
              run: pytest tests/unit/test_eval_gates.py -q
