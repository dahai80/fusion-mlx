name: CI

on:
     push:
         branches: [main, dev]
     pull_request:
         branches: [main]

jobs:
     lint:
         runs-on: ubuntu-latest
         steps:
             - uses: actions/checkout@v4
             - uses: actions/setup-python@v5
               with:
                   python-version: "3.11"
             - run: pip install ruff black mypy
             - run: ruff check fusion_mlx/ tests/
             - run: black --check fusion_mlx/ tests/

     test:
         runs-on: macos-14
         steps:
             - uses: actions/checkout@v4
             - uses: actions/setup-python@v5
               with:
                   python-version: "3.11"
             - run: pip install -e ".[dev]"
             - name: Run unit tests
               run: |
                   pytest tests/unit -v --tb=short 2>&1 | tee pytest-output.txt
             - name: Guard against excessive skips
               run: |
                   # Fail CI if >10% of tests are skipped (indicates false confidence)
                   # BSD grep (macos runners) has no -P (PCRE); use -oE with [0-9].
                   # tail -1 grabs the final summary line (avoids rerun/xdist noise).
                   SKIPPED=$(grep -oE '[0-9]+ skipped' pytest-output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
                   PASSED=$(grep -oE '[0-9]+ passed' pytest-output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
                   TOTAL=$((PASSED + SKIPPED))
                   if [ "$TOTAL" -eq 0 ]; then echo "ERROR: no tests collected"; exit 1; fi
                   PCT=$((SKIPPED * 100 / TOTAL))
                   echo "Skipped: ${SKIPPED}/${TOTAL} (${PCT}%)"
                   if [ "$PCT" -gt 10 ]; then
                     echo "FAIL: >10% tests skipped (${PCT}%) — CI provides false confidence"
                     exit 1
                   fi
