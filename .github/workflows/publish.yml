name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build distributions
        run: uv build
      - name: Generate SHA256 checksums
        run: |
          cd dist/
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    env:
      # 阶段一(API token 首发,创建 PyPI 项目):PYPI_API_TOKEN 存在用 token
      # 阶段二(trusted publisher):secret 删除后 fallback 到 OIDC
      HAS_API_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Verify SHA256 checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Publish to PyPI (API token - first release to create project)
        if: env.HAS_API_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish to PyPI (trusted publisher - OIDC)
        if: env.HAS_API_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  update-homebrew:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew formula checksums
        run: |
          chmod +x homebrew-tap/update_checksums.sh
          ./homebrew-tap/update_checksums.sh "${{ steps.version.outputs.version }}"
      - name: Verify no placeholders remain
        run: |
          remaining=$(grep -c 'PLACEHOLDER' homebrew-tap/Formula/fusion-mlx.rb || true)
          if [ "$remaining" -gt 0 ]; then
            echo "ERROR: ${remaining} PLACEHOLDER(s) remain in formula"
            grep PLACEHOLDER homebrew-tap/Formula/fusion-mlx.rb
            exit 1
          fi
      - name: Push updated formula to Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/dahai80/homebrew-fusion-mlx.git /tmp/homebrew-fusion-mlx
          cp homebrew-tap/Formula/fusion-mlx.rb /tmp/homebrew-fusion-mlx/Formula/fusion-mlx.rb
          cd /tmp/homebrew-fusion-mlx
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fusion-mlx.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update SHA256 for v${{ steps.version.outputs.version }}"
          git push
