[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-mlx"
dynamic = ["version"]
description = "fusion-mlx — unified local model management for Apple Silicon (fusion-mlx (formerly OMLX + Rapid-MLX))"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "fusion-mlx contributors"}
]
keywords = ["llm", "mlx", "apple-silicon", "vllm", "inference", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Default install = slim text-LM serving path only (issue #805). Heavy
# modality deps (mlx-vlm, dflash-mlx, transformers, markitdown, mlx-embeddings)
# live in extras so a bare `pip install fusion-mlx` boots `fusion-mlx serve`
# for text LMs without pulling ~300 MB of vision/audio/video deps. Install
# `fusion-mlx[full]` for every modality, or a single extra like `[vision]`/
# `[audio]`/`[image]`/`[video]` for just that modality. All heavy imports are
# lazy (function-scope), verified by tests/unit/test_slim_boot_805.py.
dependencies = [
    "mlx>=0.31.2",
    # PyPI-pinned deps: precise == version pins preserve reproducibility.
    # Supply-chain integrity: verify wheel/sdist SHA256 with bash scripts/verify_pypi_hashes.sh
    # (previous git-commit pins broke PyPI's no-direct-dependency policy, #348).
    "mlx-lm==0.31.3",
    "regex",
    "mistral-common>=1.10",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.23.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "itsdangerous>=2.0",
    "jinja2>=3.0",
    "sentencepiece",
    "tiktoken",
    "protobuf",
    "requests>=2.28.0",
    "socksio>=1.0.0",
    "tabulate>=0.9.0",
    "psutil>=5.9.0",
    "zeroconf>=0.131.0",
    "fastapi>=0.108.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.5",
    "jsonschema>=4.0.0",
    "openai-harmony>=0.0.8,<1.0.0",
    "Pillow>=9.0.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.24.0",
    "aiofiles>=23.0.0",
    "appdirs>=1.4.4",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "argcomplete>=3.6",
    "websockets>=12.0",
]

[project.optional-dependencies]
grammar = [
    "xgrammar>=0.1.32",
]
llguidance = [
    "llguidance>=0.5",
]
mcp = [
    "mcp>=1.0.0",
]
modelscope = [
    "modelscope>=1.10.0",
]
audio = [
    # G-7 (#0912 audit): bump 0.4.3 -> 0.5.3. 0.4.4 had a kitten_tts
    # forward-pass broadcast_shapes bug (all voices crashed); 0.5.3 fixes
    # it. mlx-audio's [tts] extra omits two optional deps that specific
    # TTS families need at runtime, causing opaque 500s:
    #   - phonemizer-fork: kitten_tts _prepare_inputs (espeak-ng binary
    #     is present but the Python pkg is not in the [tts] extra).
    #   - misaki[en]: Kokoro text processing (new in 0.5.x; needs num2words
    #     via the [en] extra).
    "mlx-audio[tts,stt,sts]==0.5.3",
    "phonemizer-fork>=3.3.2",
    "misaki[en]>=0.9.4",
    "espeakng-loader>=0.2.0",
]
image = [
    # Vendored wheel in packaging/_wheels/; install with --find-links packaging/_wheels
    "mflux-fusion==0.18.0",
]
video = [
    # Phase 5/6: vendored pure-MLX ports (fusion_mlx.video.ltx2 + wan2) replace
    # mlx-video. Deps mirror mlx-video's own Requires-Dist (core deps excluded).
    "opencv-python>=4.12.0",
    "librosa>=0.10.0",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "ftfy",
]
# Metal Flash Attention (Apple-Silicon native): optional acceleration for
# video attention. When absent the bridge transparently falls back to
# mx.fast.scaled_dot_product_attention, so this stays an opt-in extra.
mfa = [
    "mlx-mfa>=2.61.0",
]
paroquant = [
    "paroquant==0.1.14; python_version >= '3.11'",
]
# DFlash2 block-diffusion speculative decoding (z-lab official dflash pkg).
# MLX-native DFlash2DraftModel + CandidateSelector. Pinned 0.1.0; the pkg
# pins mlx==0.32.0 + mlx-lm==0.31.3 (same family as fusion-mlx core).
# Apple-Silicon-only (mlx), so platform-marker darwin/arm64. Install via
# `pip install 'fusion-mlx[dflash2]'`.
dflash2 = [
    "dflash==0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
vision = [
    "opencv-python>=4.8.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]
chat = [
    "gradio>=4.0.0",
    "pytz>=2024.1",
]
# --- Modality extras moved out of core (issue #805) ---
# These were core deps before #805. Now opt-in so a slim default install only
# serves text LMs. Pulled in by `[full]` for the all-modalities install.
# Vision-language model serving (VLM): mlx-vlm + transformers tokenizer deps.
vlm = [
    "mlx-vlm==0.5.0",
    "transformers>=5.0.0",
]
# DFlash speculative-decode draft model (NOT the same as dflash2 block-diffusion).
dflash = [
    "dflash-mlx==0.1.7",
]
# Embedding + reranker serving.
embeddings = [
    "mlx-embeddings==0.1.0",
]
# Document ingestion (markitdown route: PDF/DOCX/PPTX parsing).
document = [
    "markitdown[pdf,docx,pptx]>=0.1.0",
]
# `[full]` = every modality extra. Mirrors the pre-#805 core dependency set so
# `pip install "fusion-mlx[full]"` is a drop-in for the old all-deps install.
# Self-reference (PEP 508 / pip 21+): each entry expands this project's own
# optional-dependency group.
full = [
    "fusion-mlx[vlm,dflash,embeddings,document,audio,image,video,mfa,vision,grammar,llguidance,mcp,modelscope,paroquant,dflash2,chat]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "mcp>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/fusion-mlx/fusion-mlx"
Documentation = "https://github.com/fusion-mlx/fusion-mlx#readme"
Repository = "https://github.com/fusion-mlx/fusion-mlx"

[project.scripts]
fusion-mlx = "fusion_mlx.cli:main"
fm = "fusion_mlx.cli:main"

[tool.setuptools.dynamic]
version = {attr = "fusion_mlx._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["fusion_mlx*"]

[tool.setuptools.package-data]
"fusion_mlx" = ["aliases.json", "model-config.json", "oq_calibration_data.json"]
"fusion_mlx.audio" = ["aliases.json"]
"fusion_mlx.agents" = ["profiles/*.yaml"]
"fusion_mlx.admin" = ["templates/**/*.html", "static/**/*", "i18n/*.json"]
"fusion_mlx.gui_compat" = ["templates/**/*.html"]

[tool.uv]
override-dependencies = [
    "mlx-lm==0.31.3",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
# gui_compat/ is adapted MLX-GUI code moved in from the former top-level
# fusion_gui/ package (#63); not yet brought to black compliance.
extend-exclude = ''

[tool.ruff]
line-length = 88
# patches/ holds upstream-derived model/patch code (mlx_vlm vendor, mlx_lm_mtp,
# deepseek_v4, glm_moe_dsa). Not authored here; linting it creates merge churn.
# gui_compat/ is adapted MLX-GUI code moved in from the former top-level
# fusion_gui/ package (#63); not yet brought to ruff compliance.
extend-exclude = ["fusion_mlx/patches"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# Naming (N8xx), str-Enum modernization (UP042), and ambiguous short var (E741)
# are pre-existing in mature modules (math/tensor `N`/`l` idiom, intentional
# `str, Enum` classes whose str() semantics must not change). Ignored to match
# the codebase's established permissive style; correctness rules stay active.
ignore = ["E402", "E501", "E731", "F811", "F841", "B004", "B007", "B008", "B011", "B017", "B905", "N801", "N806", "SIM103", "SIM108", "SIM110", "SIM117", "SIM222", "UP028", "SIM102", "SIM105", "SIM115", "B904", "UP042", "E741", "N802", "N803", "N807", "N811", "N814", "N818", "SIM113", "SIM116"]

# Pin the MLX-family packages as third-party so isort classifies them
# deterministically. CI (ubuntu) cannot install the macOS-only `mlx` wheel,
# so ruff's environment-probe heuristic misclassifies `mlx` and emits I001
# false positives on adapter files that group `mlx.core`/`mlx` imports.
[tool.ruff.lint.isort]
known-third-party = ["mlx", "mlx.core", "mlx_lm", "mlx_vlm", "mlx_embeddings"]

[tool.ruff.lint.per-file-ignores]
# Package re-export surfaces: F401 (re-exports) is the __init__.py purpose.
"__init__.py" = ["F401"]
# core.py re-assembles the split Scheduler via `from .sched_X import *`
# (F403 noqa'd inline). F405 follows from that intentional star-import hub.
"fusion_mlx/scheduler/core.py" = ["F405"]
# Synchronous progress-callback closures defined per-iteration capture loop
# vars; they are invoked within the same iteration (not deferred), so B023
# (loop-variable capture) is a false positive here.
"fusion_mlx/scheduler/sched_schedule.py" = ["B023"]
"fusion_mlx/cache/prefix_cache.py" = ["B023"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "real_model: tests that load a real MLX model (gated by FUSION_MLX_REAL_MODEL_TESTS env var)",
]

[tool.coverage.run]
source = ["fusion_mlx"]
omit = ["fusion_mlx/oq.py", "fusion_mlx/service/postprocessor.py", "tests/*"]

[tool.coverage.report]
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
